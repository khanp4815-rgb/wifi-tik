<\script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function ld(k,def){try{const v=JSON.parse(localStorage.getItem(k));return v==null?def:v;}catch(e){return def;}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function rm(k){try{localStorage.removeItem(k);}catch(e){}}
let toastT;
function toast(m){const t=$('toast');t.textContent=m;t.className='on';clearTimeout(toastT);toastT=setTimeout(()=>{t.className='';},2600);}

/* ---------- SHA-256 (works everywhere, also without HTTPS) ---------- */
function sha256(msg){
const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
const b=unescape(encodeURIComponent(msg)),l=b.length;
const w=[];for(let i=0;i<l;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);
w[l>>2]|=0x80<<(24-(l%4)*8);
const n=(((l+8)>>6)+1)*16;w[n-1]=l*8;
const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
const rotr=(x,c)=>(x>>>c)|(x<<(32-c));
for(let o=0;o<n;o+=16){
const W=[];for(let i=0;i<64;i++){
if(i<16)W[i]=w[o+i]|0;
else{const s0=rotr(W[i-15],7)^rotr(W[i-15],18)^(W[i-15]>>>3),s1=rotr(W[i-2],17)^rotr(W[i-2],19)^(W[i-2]>>>10);W[i]=(W[i-16]+s0+W[i-7]+s1)|0;}
}
let[a,bb,c,d,e,f,g,h]=H;
for(let i=0;i<64;i++){
const S1=rotr(e,6)^rotr(e,11)^rotr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+W[i])|0;
const S0=rotr(a,2)^rotr(a,13)^rotr(a,22),mj=(a&bb)^(a&c)^(bb&c),t2=(S0+mj)|0;
h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;
}
H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
}
return H.map(x=>('00000000'+(x>>>0).toString(16)).slice(-8)).join('');
}
function hashPw(pw,salt){let h=sha256(salt+'|'+pw);for(let i=0;i<3000;i++)h=sha256(h+salt);return h;}

/* ---------- Login ---------- */
let auth=ld('wf_auth',null),signed=false,fails=ld('wf_fails',{n:0,until:0});
function showGate(){
$('app').hidden=true;$('gate').hidden=false;$('settings').hidden=true;
const setup=!auth;
$('gTitle').textContent=setup?'Create your login':'Sign in';
$('gSub').textContent=setup?'Choose a Login ID and password. They stay only on this phone.':'WiFi Safe List';
$('gpw2').hidden=!setup;
$('gBtn').textContent=setup?'Create login':'Sign in';
$('gForgot').hidden=setup;
$('gid').value=setup?'':(auth.id||'');
$('gpw').value='';$('gpw2').value='';$('gErr').textContent='';
$('gpw').autocomplete=setup?'new-password':'current-password';
}
function gateGo(){
const id=$('gid').value.trim(),pw=$('gpw').value,err=$('gErr');
err.textContent='';
if(!auth){
if(id.length<3){err.textContent='Login ID needs at least 3 characters.';return;}
if(pw.length<6){err.textContent='Password needs at least 6 characters.';return;}
if(pw!==$('gpw2').value){err.textContent='The two passwords do not match.';return;}
const salt=uid()+uid();
auth={id:id,salt:salt,hash:hashPw(pw,salt)};sv('wf_auth',auth);
finishLogin();return;
}
const now=Date.now();
if(fails.until>now){err.textContent='Too many tries. Wait '+Math.ceil((fails.until-now)/1000)+' seconds.';return;}
if(id.toLowerCase()===auth.id.toLowerCase()&&hashPw(pw,auth.salt)===auth.hash){
fails={n:0,until:0};sv('wf_fails',fails);finishLogin();
}else{
fails.n++;if(fails.n>=5){fails.until=now+30000;fails.n=0;}
sv('wf_fails',fails);
err.textContent=fails.until>now?'Too many tries. Wait 30 seconds.':'Wrong Login ID or password.';
}
}
function finishLogin(){
if($('gkeep').checked)sv('wf_keep',1);else rm('wf_keep');
signed=true;$('gate').hidden=true;$('app').hidden=false;
$('whoAmI').textContent=auth.id;$('setId').textContent=auth.id;
renderAll();
}
function logout(){rm('wf_keep');signed=false;$('settings').hidden=true;showGate();}
function forgot(){ask('To reset the login, open Android Settings > Apps > WiFi Safe List > Storage > Clear data. This also erases the saved phone list. Okay?',()=>{});}
$('gpw').addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('gpw2').offsetParent)gateGo();});
$('gpw2').addEventListener('keydown',e=>{if(e.key==='Enter')gateGo();});
function openSettings(){$('pwBox').hidden=true;$('cpOld').value='';$('cpNew').value='';$('cpNew2').value='';$('settings').hidden=false;}
function closeSettings(){$('settings').hidden=true;}
function changePw(){
const o=$('cpOld').value,n=$('cpNew').value;
if(hashPw(o,auth.salt)!==auth.hash){toast('Current password is wrong.');return;}
if(n.length<6){toast('New password needs at least 6 characters.');return;}
if(n!==$('cpNew2').value){toast('The two new passwords do not match.');return;}
const salt=uid()+uid();auth.salt=salt;auth.hash=hashPw(n,salt);sv('wf_auth',auth);
$('pwBox').hidden=true;toast('Password changed.');
}

/* ---------- MAC helpers ---------- */
const cleanMac=v=>String(v).replace(/[^0-9a-fA-F]/g,'').toUpperCase().slice(0,12);
const fmtMac=c=>(c.match(/.{1,2}/g)||[]).join(':');
const isPrivate=c=>c.length>=2&&[2,6,10,14].indexOf(parseInt(c.charAt(1),16))>=0;
$('mac').addEventListener('input',e=>{e.target.value=fmtMac(cleanMac(e.target.value));});

function copyText(t){
const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();toast(ok?'Copied.':'Could not copy.');};
if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>toast('Copied.'),fb);}else fb();
}

/* ---------- Phones ---------- */
let devs=ld('wifiList',[]);if(!Array.isArray(devs))devs=[];
let router=ld('wifiRouter',{addr:'192.168.1.1',model:'ZTE'});
let checks=ld('wifiChecks',{});
let tab='d',editId=null;
function renderDevs(){
$('cnt').textContent=devs.length?'Total phones: '+devs.length:'';
$('list').innerHTML=devs.length?devs.map(d=>`<div class="dev" data-id="${d.id}"><div class="di"><div class="dn">${esc(d.n)}</div><div class="dm">${esc(d.m)}</div>${d.t?`<div class="dt">${esc(d.t)}</div>`:''}${isPrivate(cleanMac(d.m))?'<span class="badge">Private MAC</span>':''}</div><div class="db"><button class="sm cp" data-a="cp">Copy</button><button class="sm" data-a="ed">Edit</button><button class="sm rd" data-a="rm">Remove</button></div></div>`).join(''):'<div class="empty">No phones yet.<br>Type a name and MAC address above and add it.</div>';
}
$('list').addEventListener('click',e=>{
const a=e.target.dataset&&e.target.dataset.a;if(!a)return;
const row=e.target.closest('.dev'),d=devs.find(x=>x.id===row.dataset.id);if(!d)return;
if(a==='cp')copyText(d.m);
else if(a==='ed')startEdit(d);
else if(a==='rm')ask('Remove this phone from the list?',()=>{devs=devs.filter(x=>x!==d);sv('wifiList',devs);if(editId===d.id)cancelEdit();renderDevs();});
});
function setForm(){$('formTitle').textContent=editId?'Edit phone details':'Add a new phone';$('saveBtn').textContent=editId?'Save':'Add';$('cancelBtn').hidden=!editId;}
function startEdit(d){editId=d.id;$('nm').value=d.n;$('mac').value=d.m;$('nt').value=d.t||'';setForm();$('nm').focus();window.scrollTo(0,0);}
function cancelEdit(){editId=null;$('nm').value='';$('mac').value='';$('nt').value='';setForm();}
function saveDev(){
const n=$('nm').value.trim(),c=cleanMac($('mac').value),t=$('nt').value.trim();
if(!n){toast('Type a name first.');$('nm').focus();return;}
if(c.length!==12){toast('A MAC address needs 12 letters/digits.');$('mac').focus();return;}
const m=fmtMac(c);
if(devs.some(d=>d.m===m&&d.id!==editId)){toast('This MAC address is already in the list.');return;}
if(editId){const d=devs.find(x=>x.id===editId);if(d){d.n=n;d.m=m;d.t=t;}}else devs.push({id:uid(),n:n,m:m,t:t});
sv('wifiList',devs);
const priv=isPrivate(c);
cancelEdit();renderDevs();
if(priv)toast('This looks like a Private MAC. In the phone\'s WiFi settings choose "Use device MAC".');
}
$('mac').addEventListener('keydown',e=>{if(e.key==='Enter')saveDev();});
function copyAllMacs(){if(!devs.length){toast('The list is empty.');return;}copyText(devs.map(d=>d.m).join('\n'));}
function copyFullList(){if(!devs.length){toast('The list is empty.');return;}copyText(devs.map((d,i)=>(i+1)+'. '+d.n+' - '+d.m+(d.t?' ('+d.t+')':'')).join('\n'));}

/* ---------- Router + checklist ---------- */
const CH=[['chk1','Set a new long WiFi password (WPA2)'],['chk2','Turned WPS off'],['chk3','Changed the router admin password'],['chk4','Added the filter on both 2.4 GHz and 5 GHz'],['chk5','Added my own MAC to the White List first'],['chk6','Chose "Use device MAC" on every phone'],['chk7','Blocked unknown devices']];
function renderRouter(){
$('raddr').value=router.addr||'';$('rmodel').value=router.model||'';
$('checks').innerHTML=CH.map(c=>`<label class="chk${checks[c[0]]?' done':''}"><input type="checkbox" data-k="${c[0]}"${checks[c[0]]?' checked':''}><span>${esc(c[1])}</span></label>`).join('');
$('prog').textContent='('+CH.filter(c=>checks[c[0]]).length+'/'+CH.length+' done)';
}
$('checks').addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;checks[k]=e.target.checked;sv('wifiChecks',checks);renderRouter();});
$('raddr').addEventListener('input',e=>{router.addr=e.target.value.trim();sv('wifiRouter',router);});
$('rmodel').addEventListener('input',e=>{router.model=e.target.value.trim();sv('wifiRouter',router);});
function copyAddr(){const a=($('raddr').value||'').trim();if(!a){$('raddr').focus();return;}copyText(a);}
function openRouter(){const a=($('raddr').value||'').trim().replace(/^https?:\/\//i,'');if(!a){$('raddr').focus();return;}try{window.open('http://'+a,'_blank');}catch(e){copyText(a);}}

/* ---------- Tabs / confirm ---------- */
function setTab(t){tab=t;$('paneD').hidden=t!=='d';$('paneR').hidden=t!=='r';$('tabD').classList.toggle('on',t==='d');$('tabR').classList.toggle('on',t==='r');}
let askFn=null;
function ask(m,fn){$('askMsg').textContent=m;askFn=fn;$('ask').hidden=false;}
function askNo(){$('ask').hidden=true;askFn=null;}
function askYes(){const f=askFn;askNo();if(f)f();}
function renderAll(){setForm();renderDevs();renderRouter();setTab(tab);
$('verbar').hidden=!UP;if(UP)$('verTxt').textContent='Version '+UP.ver;}

/* ---------- Auto update (through the outer page) ---------- */
let touched=false;
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{touched=true;},{once:true,passive:true}));
const UP=(function(){try{return window.parent&&window.parent!==window&&window.parent.AppUpd?window.parent.AppUpd:null;}catch(e){return null;}})();
function checkUpdate(manual){
if(!UP)return;
UP.check(function(st){
if(st==='ready'){if(manual||!touched){UP.apply();}else{$('updBar').hidden=false;}}
else if(manual){toast(st==='none'?'App is up to date.':st==='off'?'Update link is not set.':'Could not update. Check internet.');}
});
}
window.addEventListener('online',()=>checkUpdate(false));

/* ---------- Start ---------- */
if(auth&&ld('wf_keep',0)){signed=true;$('app').hidden=false;$('whoAmI').textContent=auth.id;$('setId').textContent=auth.id;renderAll();}
else showGate();
window.__bootOk=true;
setTimeout(()=>checkUpdate(false),1500);
<\/script>
</body>
